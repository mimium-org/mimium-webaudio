<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mimium compile test</title>
  </head>
  <body>
    <script type="module">
      import { setupMimiumAudioWorklet, transpileMimiumToRust } from "/src/index.mts";
      import processorUrl from "/src/audioprocessor.mts?url";
      const libBaseUrl = "https://raw.githubusercontent.com/mimium-org/mimium-rs/main/lib/";

      const source = `
use osc::sinwave
fn dsp(){
  sinwave(440,0)
}
`;

      const multiUseSource = `
use osc::sinwave
use filter::lowpass
fn dsp(){
  lowpass(sinwave(440,0), 1200, 0.7)
}
`;

      const coreUseSource = `
use core::mix
use osc::sinwave
fn dsp(){
  mix(0.5, sinwave(440,0), 0.0)
}
`;

      const coreWildcardSource = `
use core::*
use osc::sinwave
fn dsp(){
  mix(0.5, sinwave(440,0), 0.0)
}
`;

      const coreMacroSource = `
use core::stereo_synth
use osc::sinwave
fn dsp(){
  sinwave(440,0)
}
`;

      const noiseUseSource = `
use noise::noise
use drive::sah_auto
use osc::sinwave
fn dsp(){
  sinwave(220,0) * 0.1
}
`;

      const invalidSource = `
use osc::sinwave
fn dsp(){
  unknown_function(440,0)
}
`;

      window.runMimiumCompileTest = async () => {
        const context = new AudioContext();

        try {
          const node = await setupMimiumAudioWorklet(context, source, processorUrl, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });

          node.connect(context.destination);
          const result = { ok: true, outputChannels: node.channelCount };

          node.disconnect();
          await context.close();
          return result;
        } catch (error) {
          await context.close();
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      const runMimiumCompileOnly = async (src) => {
        const context = new AudioContext();

        try {
          const node = await setupMimiumAudioWorklet(context, src, processorUrl, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });

          node.connect(context.destination);
          const result = { ok: true, outputChannels: node.channelCount };

          node.disconnect();
          await context.close();
          return result;
        } catch (error) {
          await context.close();
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      window.runMimiumCoreUseCompileTest = async () => runMimiumCompileOnly(coreUseSource);
      window.runMimiumCoreWildcardCompileTest = async () => runMimiumCompileOnly(coreWildcardSource);
      window.runMimiumCoreMacroCompileTest = async () => runMimiumCompileOnly(coreMacroSource);
      window.runMimiumNoiseUseCompileTest = async () => runMimiumCompileOnly(noiseUseSource);

      window.runMimiumCoreUseCompileDefaultOptionsTest = async () => {
        const context = new AudioContext();

        try {
          const node = await setupMimiumAudioWorklet(context, coreUseSource, processorUrl);
          node.connect(context.destination);
          const result = { ok: true, outputChannels: node.channelCount };
          node.disconnect();
          await context.close();
          return result;
        } catch (error) {
          await context.close();
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      window.runMimiumCompileFailTest = async () => {
        const context = new AudioContext();

        try {
          await setupMimiumAudioWorklet(context, invalidSource, processorUrl, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });

          await context.close();
          return { ok: false, reason: "expected failure but compile succeeded" };
        } catch (error) {
          await context.close();
          return { ok: true, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      window.runMimiumEmitRustTest = async () => {
        try {
          const rust = await transpileMimiumToRust(source, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });
          return { ok: typeof rust === "string" && rust.length > 0, rust };
        } catch (error) {
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      window.runMimiumPlaybackSmokeTest = async () => {
        const context = new AudioContext();

        try {
          const node = await setupMimiumAudioWorklet(context, source, processorUrl, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });

          let runtimeErrorMessage = "";
          const onRuntimeError = (ev) => {
            runtimeErrorMessage = ev?.detail?.message ?? "runtime_error";
          };
          node.addEventListener("mimium-runtime-error", onRuntimeError);

          node.connect(context.destination);
          await context.resume();

          const t0 = context.currentTime;
          await new Promise((resolve) => window.setTimeout(resolve, 400));
          const elapsed = context.currentTime - t0;

          node.removeEventListener("mimium-runtime-error", onRuntimeError);
          node.disconnect();
          await context.close();

          if (runtimeErrorMessage) {
            return { ok: false, reason: `runtime error: ${runtimeErrorMessage}` };
          }
          if (elapsed <= 0) {
            return { ok: false, reason: "audio clock did not advance" };
          }

          return { ok: true, elapsed, outputChannels: node.channelCount };
        } catch (error) {
          await context.close();
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };

      window.runMimiumMultiUsePlaybackSmokeTest = async () => {
        const context = new AudioContext();

        try {
          const node = await setupMimiumAudioWorklet(context, multiUseSource, processorUrl, {
            libBaseUrl,
            moduleBaseUrl: new URL(".", location.href).toString(),
          });

          let runtimeErrorMessage = "";
          const onRuntimeError = (ev) => {
            runtimeErrorMessage = ev?.detail?.message ?? "runtime_error";
          };
          node.addEventListener("mimium-runtime-error", onRuntimeError);

          node.connect(context.destination);
          await context.resume();

          const t0 = context.currentTime;
          await new Promise((resolve) => window.setTimeout(resolve, 400));
          const elapsed = context.currentTime - t0;

          node.removeEventListener("mimium-runtime-error", onRuntimeError);
          node.disconnect();
          await context.close();

          if (runtimeErrorMessage) {
            return { ok: false, reason: `runtime error: ${runtimeErrorMessage}` };
          }
          if (elapsed <= 0) {
            return { ok: false, reason: "audio clock did not advance" };
          }

          return { ok: true, elapsed, outputChannels: node.channelCount };
        } catch (error) {
          await context.close();
          return { ok: false, reason: error instanceof Error ? error.message : String(error) };
        }
      };
    </script>
  </body>
</html>
